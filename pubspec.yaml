name: before_you_post
description: "Finds faces, personal details and codes in a photo, on-device, and hides them before you share."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  image_picker: ^1.2.3
  google_mlkit_face_detection: ^0.15.1
  google_mlkit_text_recognition: ^0.17.1
  google_mlkit_barcode_scanning: ^0.16.1
  shared_preferences: ^2.5.5
  image: ^4.9.2
  share_plus: ^13.3.0
  gal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Launcher icons. Build-time only - these source images are deliberately
# NOT listed under flutter.assets, because they are baked into the Android
# mipmaps by the generator and would otherwise also be shipped inside the
# APK for nothing.
#
# Regenerate after editing assets/icon/ with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1E3A5F"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 24
